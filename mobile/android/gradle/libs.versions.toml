# Pinned at scaffold time (2026-08-12); Android Studio may suggest bumps on
# first sync — take them, nothing here is version-sensitive.
[versions]
agp = "8.12.0"
kotlin = "2.2.10"
coreKtx = "1.17.0"
activity = "1.11.0"
webkit = "1.14.0"
splashscreen = "1.0.1"
autofill = "1.1.0"
serializationJson = "1.9.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
