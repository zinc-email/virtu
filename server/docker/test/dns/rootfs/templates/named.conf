options {
  directory "/var/cache/bind";

  // Hermetic on purpose: no forwarders. This server is authoritative for
  // every domain the simulated internet knows about; anything else fails to
  // resolve, so tests can never accidentally reach (or mail) a real host.
  // The networks in docker-compose.test.yml are `internal: true` for the
  // same reason.
  dnssec-validation no;

  auth-nxdomain no;    # conform to RFC1035
  listen-on { 192.168.43/24; 192.168.34/24; };
  recursion yes;
};

// Reverse DNS
zone "168.192.in-addr.arpa" { type master; file "/var/lib/bind/db.192.168"; };

// The product itself. MX/mail point at 192.168.34.101 — the address
// RESERVED for our mx (wave 2); it answers nothing until then.
// Dynamic updates allowed so test fixtures can publish DKIM keys
// (our signing keys live in Postgres, not in this zone template).
zone "virtu.email" {
  type master;
  file "/var/lib/bind/db.virtu.email";
  allow-update {
    127.0.0.1;
    192.168.34/24;
    192.168.43/24;
  };
};

// Pretend docusign (strict DMARC, used by initech.com)
zone "docusign.com" { type master; file "/var/lib/bind/db.docusign.com"; };

// Pretend Gmail (users' real mailboxes; deliberately no DMARC/DKIM records)
zone "qmail.com" { type master; file "/var/lib/bind/db.qmail.com"; };

// Pretend Yahoo (DMARC p=reject)
zone "yahoo.com" { type master; file "/var/lib/bind/db.yahoo.com"; };

// Pretend Void (blackhole)
zone "void.com" { type master; file "/var/lib/bind/db.void.com"; };

// Pretend Initech, Inc. (legit correspondent, DMARC p=reject)
zone "initech.com" { type master; file "/var/lib/bind/db.initech.com"; };

// Pretend open relay (spammer origin)
zone "open.relay" { type master; file "/var/lib/bind/db.open.relay"; };

// A customer's personal domain, MX'd at virtu. Dynamic updates allowed so
// custom-domain verification stories can add/break DKIM records at runtime.
zone "user.com" {
  type master;
  file "/var/lib/bind/db.user.com";
  allow-update {
    127.0.0.1;
    192.168.34/24;
    192.168.43/24;
  };
};
