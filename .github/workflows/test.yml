# CI — format, typecheck, unit tests. No docker: the int tier (routes
# against the dockerized postgres) runs locally via `just test-int`.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install root tooling (biome)
        run: bun install --frozen-lockfile

      - name: Install server deps
        run: bun install --frozen-lockfile
        working-directory: server

      - name: Install client deps
        run: bun install --frozen-lockfile
        working-directory: client

      - name: Format check
        run: bin/format-check

      - name: Typecheck (server + client, regenerates client SDK from the committed spec)
        run: bin/typecheck

      - name: Unit tests
        run: bun test unit.test
        working-directory: server

      - name: Bridge contract tests (client shell seam ↔ each shell's shim)
        run: bun test mobile
