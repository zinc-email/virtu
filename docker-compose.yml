# Dev stack — the daily-driver services only (db, api, client). The
# simulated-internet test network (fake DNS, peer MTAs) lives in a separate
# compose overlay owned by Lane H.
#
# Run via bin/compose (or `just up`), which exports APP_UID/APP_GID so the
# bind-mount writes (node_modules, generated SDK) are host-owned, not root.

services:
  db:
    image: "postgres:17-alpine"
    init: true
    shm_size: 128mb
    environment:
      POSTGRES_USER: virtu
      POSTGRES_PASSWORD: virtu
    ports:
      # Host ports are overridable so parallel checkouts can coexist.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: pg_isready -U virtu -h 127.0.0.1
      interval: 5s
    volumes:
      - "pg_data:/var/lib/postgresql/data:rw"

  api:
    # Debian-based (not alpine): node_modules live in the bind mount shared
    # with the host, and native bindings (rspack in the client) are
    # platform-specific — keep container libc matching the usual host.
    image: "oven/bun:1.3"
    working_dir: /app/server
    # bun install first: node_modules live in the bind mount and may be
    # missing (fresh clone) or host-installed for a different platform.
    command: ["sh", "-c", "bun install && bun --watch src/api.ts"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      DATABASE_URL: "postgres://virtu:virtu@db:5432/virtu"
      # An arbitrary host uid has no /etc/passwd entry, so HOME would default
      # to "/" (unwritable) and `bun install` couldn't write its cache.
      HOME: /tmp
      # The DOM test tier registers a fresh user per test, all from one host
      # IP — don't let the auth limiter starve repeated local runs.
      AUTH_RATE_LIMIT_MAX: "1000"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    init: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ".:/app"

  # One-shot: install client deps with the stack's pinned bun (bun.lock is
  # the lockfile; node_modules land in the bind mount). Same pattern as the
  # serve stack's one-shot build service.
  client-deps:
    image: "oven/bun:1.3"
    working_dir: /app/client
    command: ["bun", "install"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ".:/app"

  client:
    # The client is BROWSER code built by node tooling — its dev container is
    # a plain node image (also necessary: rsbuild's HMR WebSocket never
    # completes under bun's node:http — the socket hangs in "connecting").
    # Deps come from client-deps above; the toolchain bins (kubb, panda,
    # rsbuild) are node CLIs run directly from node_modules. Debian-based to
    # match host libc for the shared bind mount.
    # Current line — becomes the Active LTS in October; the tag rides along.
    image: "node:26-bookworm-slim"
    working_dir: /app/client
    command:
      [
        "sh",
        "-c",
        "node_modules/.bin/kubb generate && node_modules/.bin/panda codegen && node_modules/.bin/rsbuild dev",
      ]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      HOME: /tmp
    ports:
      # The SPA is served under /app; direct access is http://localhost:9000/app.
      - "127.0.0.1:${CLIENT_PORT:-9000}:9000"
    init: true
    depends_on:
      api:
        condition: service_started
      client-deps:
        condition: service_completed_successfully
    volumes:
      - ".:/app"

  # Static marketing homepage (Astro dev server). Serves / at the unified
  # origin. Reached only by the proxy on the compose network (www:4321), so no
  # host port — go through http://localhost:8080.
  www:
    image: "oven/bun:1.3"
    working_dir: /app/www
    # --ignore-lock: astro's dev lock (www/.astro/dev.json) records a PID, and
    # the file lives in the bind mount, so it outlives the container. On the
    # next start the recorded PID is very much alive in the FRESH pid namespace
    # — it's this astro process — so the lock reads as held rather than stale.
    # `--force` then "replaces the running server" by SIGTERMing that pid, i.e.
    # itself, and the container dies 0.5s in with exit 143. --ignore-lock skips
    # the lock entirely: never read, never written. (Mutually exclusive with
    # --force.) Host-side `just www-dev` keeps normal lock semantics.
    command: ["sh", "-c", "bun install && bun run dev -- --ignore-lock"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      HOME: /tmp
      # Astro's telemetry reads os.cpus(), which returns [] under Bun-in-docker
      # and crashes the dev server on startup. We don't want telemetry anyway.
      ASTRO_TELEMETRY_DISABLED: "1"
    init: true
    volumes:
      - ".:/app"

  # Reverse proxy — the unified dev origin (mirrors prod topology, see Caddyfile).
  # This is the front door: http://localhost:8080 (/, /app, /api).
  proxy:
    image: "caddy:2-alpine"
    init: true
    # Caddy drains connections on SIGTERM; cap the wait so `just down` is snappy.
    stop_grace_period: 3s
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    depends_on:
      - api
      - client
      - www
    volumes:
      - "./Caddyfile.dev:/etc/caddy/Caddyfile:ro"

volumes:
  pg_data:
